<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bride’s Little Guide | دليل العروسة المصغر</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#4a0a0a;--card:#5a1111;--line:#c9a27a66;--gold:#f0d4b0;--soft:#d9b995;--accent:#e7b98a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--gold);font-family:'Tajawal',Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{max-width:1234px;margin:0 auto 16px}.hero{display:block;width:100%;height:auto;border-radius:0}
.rm{font-family:'Great Vibes',cursive;font-size:30px;color:var(--soft)}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,12vw,64px);margin:0;line-height:1.1;direction:ltr}
.ar{font-size:22px;margin:4px 0 14px;color:var(--soft)}
.intro{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:#00000022;text-align:center;font-size:15.5px}
.intro b{display:block;font-size:17px;margin-bottom:4px}
.prog{margin:18px 0 6px;font-size:14px;display:flex;justify-content:space-between;color:var(--soft)}
.bar{height:8px;background:#00000055;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a27a,#f6e3c8);transition:width .4s}
details{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:18px}
summary::-webkit-details-marker{display:none}
summary .ic{font-size:20px}
summary .t{flex:1}
.cnt{font-size:13px;font-weight:500;color:var(--bg);background:var(--accent);border-radius:20px;padding:0 10px}
summary::after{content:"";width:9px;height:9px;border:solid var(--soft);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .25s;margin-inline-start:4px}
details[open] summary::after{transform:rotate(-135deg)}
details[open] summary{border-bottom:1px solid var(--line)}
ul{list-style:none;margin:0;padding:6px 10px 10px}
li label{display:flex;gap:12px;align-items:center;padding:9px 6px;cursor:pointer;font-size:16px;border-radius:10px}
li label:active{background:#ffffff11}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--accent);border-radius:50%;display:grid;place-content:center;margin:0;cursor:pointer}
input[type=checkbox]:checked{background:var(--accent)}
input[type=checkbox]:checked::after{content:"✓";color:var(--bg);font-size:14px;font-weight:700}
li.done span{text-decoration:line-through;opacity:.55}
.add{display:flex;gap:8px;padding:4px 10px 12px}
.add input{flex:1;min-width:0;background:#00000033;border:1px solid var(--line);border-radius:12px;color:var(--gold);padding:9px 12px;font:inherit;font-size:15px}
.add button,.reset{background:transparent;border:1px solid var(--accent);color:var(--gold);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.reset{display:block;margin:26px auto 0;font-size:14px;opacity:.8}
footer{text-align:center;margin-top:22px;font-size:20px;color:var(--soft)}
textarea{display:block;width:calc(100% - 20px);margin:0 10px 12px;background:#00000033;border:1px solid var(--line);border-radius:12px;color:var(--gold);padding:10px 12px;font:inherit;font-size:15px;resize:vertical;min-height:80px}
.gen{margin-top:22px}.gen h2{font-size:18px;margin:0 0 8px}.gen textarea{width:100%;margin:0;min-height:120px}

[hidden]{display:none!important}
body.admin .intro,body.admin .prog,body.admin .bar,body.admin .gen,body.admin .reset,body.admin footer{display:none}
#adminbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:#2b0606;border:1px solid var(--line);border-radius:16px}
#adminbar .msg{flex:1;font-size:13.5px;color:var(--soft)}
.abtn{background:transparent;border:1px solid var(--accent);color:var(--gold);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.abtn.fill{background:var(--accent);color:var(--bg);font-weight:700}
.abtn:disabled{opacity:.5;cursor:default}
.sec{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px}
.ed{width:100%;min-width:0;background:#00000033;border:1px solid var(--line);border-radius:12px;color:var(--gold);padding:9px 12px;font:inherit;font-size:15px}
.erow{display:flex;gap:8px;align-items:center;margin-top:8px}
.sec .erow:first-child{margin-top:0}.sec .erow:first-child .ed{font-weight:700;font-size:17px}
.x{background:none;border:0;color:var(--soft);font-size:22px;line-height:1;padding:4px 10px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#auth .box{width:100%;max-width:380px;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:24px 20px}
#auth h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:42px;margin:0;text-align:center;direction:ltr;line-height:1.2}
#auth .sub{text-align:center;color:var(--soft);margin:2px 0 14px;font-size:15px}
#auth .ed{margin-top:10px;direction:ltr;text-align:right}
#auth .abtn{width:100%;margin-top:14px;padding:11px}
#auth .sw{display:block;margin:12px auto 0;background:none;border:0;color:var(--soft);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
#amsg{min-height:22px;margin-top:10px;font-size:13.5px;text-align:center;color:var(--accent)}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 4px;border-top:1px solid var(--line)}
.urow .em{direction:ltr;text-align:right;font-size:14px;overflow:hidden;text-overflow:ellipsis}.urow .pc{font-weight:700}
.ub{grid-column:1/3;height:6px;background:#00000055;border-radius:6px;overflow:hidden}.ub i{display:block;height:100%;background:linear-gradient(90deg,#c9a27a,#f6e3c8)}
.big{font-size:17px;font-weight:700}.msgu{text-align:center;color:var(--soft)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

<script>
var SB_URL="https://wcwquwpaobnbvwziizqv.supabase.co",SB_KEY="sb_publishable_liUfltHzELRdlw1h4Agqdw_xZhwIRrF";
var ADMIN_EMAILS=[]; // اختياري: إيميلات المشرفات لإظهار لوحة الإضافة (الحماية الفعلية من جدول admins)
var cfg=JSON.parse(document.getElementById("cfg").textContent),S=cfg.lists;
var K="bride-guide-v2",st={done:{},custom:{},open:{},notes:{}},admin=false,usersView=false,sb=null,me=null,tmr=null;

st.done=st.done||{};st.custom=st.custom||{};st.open=st.open||{};st.notes=st.notes||{};
function save(){cloudSave()}
function uid(){return"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function rows(s){var a=s.items.map(function(i){return{k:i.id,x:i.x}});(st.custom[s.id]||[]).forEach(function(x,n){a.push({k:s.id+"-c"+n,x:x})});return a}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function renderViewer(){
  var L=document.getElementById("list"),tot=0,dn=0;L.innerHTML="";
  S.forEach(function(s){
    var it=rows(s),d=0,det=document.createElement("details");
    if(st.open[s.id])det.open=true;
    det.addEventListener("toggle",function(){st.open[s.id]=det.open;save()});
    var sum=mk("summary"),cnt=mk("span","cnt");sum.appendChild(mk("span","t",s.t));sum.appendChild(cnt);det.appendChild(sum);
    var ul=document.createElement("ul");
    it.forEach(function(o){
      var on=st.done[o.k]?1:0;d+=on;
      var li=mk("li",on?"done":""),lab=document.createElement("label"),cb=document.createElement("input");
      cb.type="checkbox";cb.checked=!!on;
      cb.addEventListener("change",function(){if(cb.checked)st.done[o.k]=1;else delete st.done[o.k];save();render()});
      lab.appendChild(cb);lab.appendChild(mk("span","",o.x));li.appendChild(lab);ul.appendChild(li);
    });
    tot+=it.length;dn+=d;cnt.textContent=d+"/"+it.length;det.appendChild(ul);
    var add=mk("div","add"),inp=document.createElement("input");
    inp.type="text";inp.placeholder="أضيفي بند جديد…";inp.maxLength=60;
    var b=mk("button","","إضافة");b.type="button";
    function go(){var v=inp.value.trim();if(!v)return;(st.custom[s.id]=st.custom[s.id]||[]).push(v);st.open[s.id]=true;save();render()}
    b.addEventListener("click",go);
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go()}});
    add.appendChild(inp);add.appendChild(b);det.appendChild(add);
    var ta=mk("textarea","note");ta.rows=3;ta.maxLength=2000;ta.placeholder="مساحة لملاحظاتك…";ta.value=st.notes[s.id]||"";
    ta.addEventListener("input",function(){st.notes[s.id]=ta.value;save()});
    det.appendChild(ta);L.appendChild(det);
  });
  var p=tot?Math.round(dn/tot*100):0;
  document.getElementById("pt").textContent=p+"%";
  document.getElementById("pb").style.width=p+"%";
}

function dirty(){document.getElementById("publish").hidden=false;document.getElementById("msg").textContent="عندك تغييرات غير منشورة"}
function renderAdmin(){
  var L=document.getElementById("list");L.innerHTML="";
  S.forEach(function(s,si){
    var sec=mk("div","sec"),r1=mk("div","erow"),t=document.createElement("input");
    t.type="text";t.className="ed";t.value=s.t;t.setAttribute("aria-label","اسم القسم");
    t.addEventListener("input",function(){s.t=t.value;dirty()});
    var ds=mk("button","abtn","حذف القسم");ds.type="button";
    ds.addEventListener("click",function(){if(!confirm("حذف القسم وكل بنوده؟"))return;S.splice(si,1);dirty();render()});
    r1.appendChild(t);r1.appendChild(ds);sec.appendChild(r1);
    s.items.forEach(function(it,ii){
      var r=mk("div","erow"),x=document.createElement("input");
      x.type="text";x.className="ed";x.value=it.x;x.setAttribute("aria-label","نص البند");
      x.addEventListener("input",function(){it.x=x.value;dirty()});
      var d=mk("button","x","×");d.type="button";d.setAttribute("aria-label","حذف البند");
      d.addEventListener("click",function(){s.items.splice(ii,1);dirty();render()});
      r.appendChild(x);r.appendChild(d);sec.appendChild(r);
    });
    var ra=mk("div","erow"),ai=document.createElement("input");
    ai.type="text";ai.className="ed";ai.placeholder="بند جديد في هذا القسم";
    var ab=mk("button","abtn","إضافة بند");ab.type="button";
    function go(){var v=ai.value.trim();if(!v)return;s.items.push({id:uid(),x:v});dirty();render()}
    ab.addEventListener("click",go);
    ai.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go()}});
    ra.appendChild(ai);ra.appendChild(ab);sec.appendChild(ra);L.appendChild(sec);
  });
  var rs=mk("div","erow"),ni=document.createElement("input");
  ni.type="text";ni.className="ed";ni.placeholder="اسم قسم جديد";
  var nb=mk("button","abtn fill","إضافة قسم");nb.type="button";
  function goS(){var v=ni.value.trim();if(!v)return;S.push({id:uid(),e:"",t:v,items:[]});dirty();render()}
  nb.addEventListener("click",goS);
  ni.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();goS()}});
  rs.appendChild(ni);rs.appendChild(nb);L.appendChild(rs);
}

function render(){
  document.body.classList.toggle("admin",admin);
  document.getElementById("toggle").textContent=admin?"عرض الصفحة":"لوحة التحكم";
  if(admin&&usersView)renderUsers();else if(admin)renderAdmin();else renderViewer();
}
document.getElementById("toggle").addEventListener("click",function(){admin=!admin;usersView=false;render()});
document.getElementById("ubtn").addEventListener("click",function(){admin=true;usersView=true;render()});

document.getElementById("publish").addEventListener("click",async function(){
  var btn=this,msg=document.getElementById("msg");btn.disabled=true;msg.textContent="جاري الحفظ…";
  var r=await sb.from("site_config").upsert({id:1,lists:S,updated_at:new Date().toISOString()});
  btn.disabled=false;
  if(r.error){msg.textContent="ما انحفظت التغييرات، تأكدي أن حسابك مشرفة";return}
  btn.hidden=true;msg.textContent="تم الحفظ ويظهر للجميع ✓";
});

var gn=document.getElementById("gn");gn.value=st.notes.gen||"";
gn.addEventListener("input",function(){st.notes.gen=gn.value;save()});
document.getElementById("reset").addEventListener("click",function(){
  if(confirm("تبين تمسحين كل علامات الإنجاز والبنود المضافة والملاحظات؟")){st={done:{},custom:{},open:{},notes:{}};gn.value="";save();render()}
});
render();

function pctNow(){var t=0,d=0;S.forEach(function(x){rows(x).forEach(function(o){t++;if(st.done[o.k])d++})});return t?Math.round(d/t*100):0}
function cloudSave(){if(!sb||!me)return;clearTimeout(tmr);tmr=setTimeout(function(){sb.from("progress").upsert({user_id:me.id,email:me.email,pct:pctNow(),data:st,updated_at:new Date().toISOString()}).then(function(r){if(r.error)console.error(r.error)})},800)}
async function renderUsers(){
  var L=document.getElementById("list");L.innerHTML="";L.appendChild(mk("p","msgu","جاري التحميل…"));
  var r=await sb.from("progress").select("email,pct,updated_at").order("updated_at",{ascending:false});
  L.innerHTML="";if(r.error){L.appendChild(mk("p","msgu","تعذّر التحميل"));return}
  var u=r.data||[],avg=u.length?Math.round(u.reduce(function(a,b){return a+b.pct},0)/u.length):0,top=mk("div","sec");
  top.appendChild(mk("div","big",u.length+" مستخدمة، متوسط الإنجاز "+avg+"%"));
  u.forEach(function(x){var w=mk("div","urow"),b=mk("div","ub"),i=document.createElement("i");i.style.width=x.pct+"%";b.appendChild(i);w.appendChild(mk("span","em",x.email||"—"));w.appendChild(mk("span","pc",x.pct+"%"));w.appendChild(b);top.appendChild(w)});
  L.appendChild(top);
}
var au=document.getElementById("auth"),am=document.getElementById("amsg"),aem=document.getElementById("aem"),apw=document.getElementById("apw"),amode="in";
function amsg(t){am.textContent=t||""}
async function enter(user){
  me=user;
  var c=await sb.from("site_config").select("lists").eq("id",1).maybeSingle();
  if(c.data&&c.data.lists&&c.data.lists.length){S.length=0;c.data.lists.forEach(function(x){S.push(x)})}
  var p=await sb.from("progress").select("data").eq("user_id",user.id).maybeSingle();
  st=(p.data&&p.data.data)||{};st.done=st.done||{};st.custom=st.custom||{};st.open=st.open||{};st.notes=st.notes||{};
  gn.value=st.notes.gen||"";
  var a=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();
  var isAdm=!!a.data||ADMIN_EMAILS.indexOf((user.email||"").toLowerCase())>-1;
  document.getElementById("adminbar").hidden=!isAdm;
  admin=isAdm;usersView=false;render();au.hidden=true;cloudSave();
}
document.getElementById("asw").addEventListener("click",function(){
  amode=amode==="in"?"up":"in";amsg("");
  document.getElementById("ago").textContent=amode==="in"?"دخول":"إنشاء حساب";
  this.textContent=amode==="in"?"ما عندك حساب؟ أنشئي حساب":"عندك حساب؟ سجّلي دخول";
  apw.autocomplete=amode==="in"?"current-password":"new-password";
});
document.getElementById("ago").addEventListener("click",async function(){
  if(!sb)return;if(amode==="rec"){var np=apw.value;if(np.length<6){amsg("كلمة السر ٦ أحرف على الأقل");return}amsg("لحظات…");var u=await sb.auth.updateUser({password:np});if(u.error){amsg("تعذّر الحفظ: "+u.error.message);return}history.replaceState(null,"",location.pathname);aem.hidden=false;document.getElementById("asw").hidden=false;document.getElementById("afg").hidden=false;amode="in";amsg("");enter(u.data.user);return}var e=aem.value.trim(),pw=apw.value;
  if(!e||pw.length<6){amsg("اكتبي الإيميل وكلمة سر ٦ أحرف على الأقل");return}
  amsg("لحظات…");
  var r=amode==="in"?await sb.auth.signInWithPassword({email:e,password:pw}):await sb.auth.signUp({email:e,password:pw});
  if(r.error){amsg(/invalid login/i.test(r.error.message)?"الإيميل أو كلمة السر غير صحيحة":"تعذّر الدخول: "+r.error.message);return}
  if(!r.data.session){amsg("تم إنشاء الحساب. افتحي رسالة التأكيد في إيميلك ثم سجّلي دخولك.");return}
  amsg("");enter(r.data.user);
});
document.getElementById("afg").addEventListener("click",async function(){
  if(!sb)return;var e=aem.value.trim();
  if(!e){amsg("اكتبي إيميلك أول ثم اضغطي نسيتي كلمة السر");return}
  amsg("لحظات…");
  var r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  if(r.error){amsg("تعذّر الإرسال: "+r.error.message);return}
  amsg("أرسلنا لك رابط تغيير كلمة السر على إيميلك.");
});
function startRec(){
  amode="rec";au.hidden=false;aem.hidden=true;
  document.getElementById("asw").hidden=true;document.getElementById("afg").hidden=true;
  document.getElementById("asub").textContent="اكتبي كلمة السر الجديدة";
  apw.value="";apw.placeholder="كلمة السر الجديدة (٦ أحرف على الأقل)";apw.autocomplete="new-password";
  document.getElementById("ago").textContent="حفظ كلمة السر";amsg("");
}
document.getElementById("logout").addEventListener("click",async function(){if(sb)await sb.auth.signOut();location.reload()});
(async function(){
  try{
    if(!window.supabase||SB_URL.indexOf("http")!==0||SB_KEY.length<20){amsg("الموقع غير مربوط بعد: أضيفي مفاتيح Supabase في أول السكربت.");return}
    var rec=/type=recovery/.test(location.hash);
    sb=window.supabase.createClient(SB_URL,SB_KEY);
    sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY")startRec()});
    var r=await sb.auth.getSession();
    if(rec){startRec();return}
    if(r.data&&r.data.session)await enter(r.data.session.user);
  }catch(e){amsg("صار خطأ بالاتصال، حدّثي الصفحة.")}
})();
</script>
